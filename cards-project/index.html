<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main id="playing-cards">
        <div class="card">
            <div class="left">
                <p>A</p>
                <p>♠</p>
            </div>
            <div class="middle">
                <p>♠</p>
            </div>
            <div class="right upside-down">
                <p>A</p>
                <p>♠</p>
            </div>
        </div>
        <div class="card red-card">
            <div class="left">
                <p>3</p>
                <p>♥</p>
            </div>
            <div class="middle">
                <div class="middle-section">
                    <p>♥</p>                 
                </div>
                <div class="middle-section">
                    <p>♥</p>                 
                </div>
                <div class="middle-section upside-down">
                    <p>♥</p>                 
                </div>
            </div>
            <div class="right upside-down">
                <p>3</p>
                <p>♥</p>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <p>8</p>
                <p>♣</p>
            </div>
            <div class="middle">
                <div class="middle-section">
                    <p>♣</p>
                    <p>♣</p>
                </div>
                <div class="middle-section">
                    <p>♣</p>
                </div>
                <div class="middle-section">
                    <p>♣</p>
                    <p>♣</p>
                </div>
                <div class="middle-section upside-down">
                    <p>♣</p>
                </div>
                <div class="middle-section upside-down">
                    <p>♣</p>
                    <p>♣</p>
                </div>
            </div>
            <div class="right upside-down">
                <p>8</p>
                <p>♣</p>
            </div>
        </div>
        <div class="card red-card">
            <div class="left">
                <p>10</p>
                <p>♦</p>
            </div>
            <div class="middle">
                <div class="middle-section">
                    <p>♦</p>
                    <p>♦</p>                 
                </div>
                <div class="middle-section">
                    <p>♦</p>                 
                </div>
                <div class="middle-section">
                    <p>♦</p>
                    <p>♦</p>                 
                </div>
                <div class="middle-section">
                    <p>♦</p>
                    <p>♦</p>                 
                </div>
                <div class="middle-section">
                    <p>♦</p>                 
                </div>
                <div class="middle-section">
                    <p>♦</p>
                    <p>♦</p>                 
                </div>
            </div>
            <div class="right upside-down">
                <p>10</p>
                <p>♦</p>
            </div>
        </div>
    </main>
</body>
</html>
