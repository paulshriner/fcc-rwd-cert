<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main id="playing-cards">
        <div class="card">
            <div class="left">
                <p>A</p>
                <p>♠</p>
            </div>
            <div class="middle">
                <p>♠</p>
            </div>
            <div class="right">
                <p class="upside-down">♠</p>
                <p class="upside-down">A</p>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <p>A</p>
                <p>♠</p>
            </div>
            <div class="middle">
                <p>♠</p>
            </div>
            <div class="right">
                <p class="upside-down">♠</p>
                <p class="upside-down">A</p>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <p>A</p>
                <p>♠</p>
            </div>
            <div class="middle">
                <p>♠</p>
            </div>
            <div class="right">
                <p class="upside-down">♠</p>
                <p class="upside-down">A</p>
            </div>
        </div>
    </main>
</body>
</html>
